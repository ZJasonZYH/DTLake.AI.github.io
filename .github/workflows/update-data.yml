name: 自动更新AI模型数据

on:
  # 每月1日的上午9点自动运行
  schedule:
    - cron: '0 9 1 * *'
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置Python环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 matplotlib pandas seaborn scikit-learn

      - name: 下载生成脚本
        run: |
          mkdir -p ../scripts
          curl -o ../scripts/generate_static_site.py https://raw.githubusercontent.com/ZJasonZYH/DTLake.AI.github.io/main/generate_static_site.py
          curl -o ../scripts/ai_model_scraper.py https://raw.githubusercontent.com/ZJasonZYH/DTLake.AI.github.io/main/ai_model_scraper.py
          chmod +x ../scripts/generate_static_site.py

      - name: 生成最新数据和静态网站
        run: |
          cd ..
          python scripts/generate_static_site.py

      - name: 更新仓库内容
        run: |
          # 复制生成的文件到当前目录
          cp -r ../static_site/* .
          rm -rf ../static_site
          
          # 配置Git
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          
          # 添加并提交更改
          git add .
          git commit -m "自动更新AI模型数据 $(date +'%Y-%m-%d')"
          
          # 推送到仓库
          git push origin main
