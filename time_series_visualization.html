            companyData.sort((a, b) => new Date(a.date + '-01') - new Date(b.date + '-01'));
            
            return {
                label: company,
                data: companyData.map(item => ({
                    x: new Date(item.date + '-01'),
                    y: item.score
                })),
                borderColor: companyColors[company] || '#999999',
                backgroundColor: companyColors[company] || '#999999',

                pointRadius: 5,
                pointHoverRadius: 8,

                fill: false,
                showLine: true
